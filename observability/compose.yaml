name: unama-pipeline-final
services:
  registry:
    image: registry:2.8.3
    container_name: unama-pipeline-final-registry
    ports: ["127.0.0.1:15000:5000"]
    volumes: ["registry-data:/var/lib/registry"]
    mem_limit: 128m
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.0
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      xpack.ml.enabled: "false"
      node.store.allow_mmap: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports: ["127.0.0.1:19200:9200"]
    volumes: ["es-data:/usr/share/elasticsearch/data"]
    mem_limit: 1536m
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30
  kibana:
    image: docker.elastic.co/kibana/kibana:8.17.0
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
      XPACK_SECURITY_ENABLED: "false"
      TELEMETRY_ENABLED: "false"
      NODE_OPTIONS: --max-old-space-size=768
    ports: ["127.0.0.1:15601:5601"]
    depends_on:
      elasticsearch: {condition: service_healthy}
    mem_limit: 1536m
  filebeat:
    image: docker.elastic.co/beats/filebeat:8.17.0
    user: root
    command: ["filebeat", "-e", "--strict.perms=false"]
    volumes:
      - ./filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - ${LAB_DIR:?Defina LAB_DIR}/logs:/logs:ro
      - beat-data:/usr/share/filebeat/data
    depends_on:
      elasticsearch: {condition: service_healthy}
    mem_limit: 256m
volumes:
  registry-data:
  es-data:
  beat-data:
